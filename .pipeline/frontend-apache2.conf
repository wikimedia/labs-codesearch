# Minimal Apache config for the codesearch-frontend image (see blubber.yaml).
# Kept out of frontend/ so it is neither served nor part of the Dockerfile build.
# Runs as the unprivileged blubber user, so listen on a high port and keep
# all runtime files in /tmp.
ServerRoot /etc/apache2
ServerName localhost
Listen 8080
PidFile /tmp/apache2.pid
Mutex file:/tmp default
ErrorLog /dev/stderr
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
CustomLog /dev/stdout combined

LoadModule mpm_prefork_module /usr/lib/apache2/modules/mod_mpm_prefork.so
LoadModule authz_core_module /usr/lib/apache2/modules/mod_authz_core.so
LoadModule dir_module /usr/lib/apache2/modules/mod_dir.so
LoadModule mime_module /usr/lib/apache2/modules/mod_mime.so
LoadModule rewrite_module /usr/lib/apache2/modules/mod_rewrite.so
LoadModule php_module /usr/lib/apache2/modules/libphp8.4.so

TypesConfig /etc/mime.types

php_admin_value opcache.validate_timestamps 0
php_admin_value opcache.jit_buffer_size 32M
php_admin_value memory_limit 128M
php_admin_value max_execution_time 30

DocumentRoot /srv/app
DirectoryIndex index.php
<Directory />
    AllowOverride None
    Require all denied
</Directory>
<Directory /srv/app>
    # frontend/.htaccess is only for the Dockerfile build, the same rules are here
    AllowOverride None
    Require all granted

    RewriteEngine on

    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteRule ^/?[_0-9a-z]+/?$ /index.php [L,QSA]

    # Compat redirect for scripts written against the Hound UI,
    # which exposes the API on the same domain
    RewriteCond %{ENV:CODESEARCH_HOUND_BASE_PUBLIC} ^(https?://.+?)/*$
    RewriteRule ^/?([0-9a-z]+/api/.+)$ %1/$1 [L,R=301]
    RewriteRule ^/?([0-9a-z]+/api/.+)$ https://codesearch-backend.wmcloud.org/$1 [L,R=301]
</Directory>
# like Debian's apache2.conf, which is not used here
<FilesMatch "^\.ht">
    Require all denied
</FilesMatch>
<FilesMatch "\.php$">
    SetHandler application/x-httpd-php
</FilesMatch>
