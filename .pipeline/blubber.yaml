version: v4
base: docker-registry.wikimedia.org/trixie:latest
variants:
  build:
    base: docker-registry.wikimedia.org/golang1.24:1.24-20261004
    apt:
      packages:
        - gcc
        - git
  prep:
    includes: [build]
    builder:
      command: [go, build, -buildvcs=false, ./cmds/houndd]
      requirements: [./hound]
  hound:
    apt:
      packages:
        - ca-certificates
        - git
    copies:
      - from: prep
        source: /srv/app/houndd
        destination: /srv/app/houndd
    entrypoint: ["./houndd", "-conf", "/data/config.json"]
  frontend-prep:
    apt:
      packages:
        - composer
        - php8.4-apcu
        - php8.4-cli
        - php8.4-curl
        - php8.4-xml
        - unzip
    builder:
      requirements:
        - from: local
          source: ./frontend
          destination: .
      # Installs mustache.php, since the PECL extension used by
      # frontend/Dockerfile is not packaged in Debian, and writes
      # staticversion.txt like the Dockerfile does.
      command:
        - sh
        - -c
        - >-
          composer install --no-interaction --no-progress --no-dev --optimize-autoloader &&
          find static -type f -print0 | xargs -0 sha1sum | sort | sha1sum | head -c 7 > staticversion.txt
  frontend-test-php84:
    includes: [frontend-prep]
    builder:
      command:
        - sh
        - -c
        - >-
         composer install && composer test
  frontend-test-php85:
    # Currently uses Debian 12 Bookworm instead of Debian 13 Trixie
    # with php8.5-* from the `bookworm-wikimedia component/php85` apt source
    # per https://gerrit.wikimedia.org/g/operations/docker-images/production-images/+/da97913fbe1/images/php/8.5/cli/Dockerfile.template
    # and Composer from https://packages.debian.org/bookworm/composer
    #
    # NOTE: Because this uses Debian 12, it installs Composer 2.5, which was
    # meant for use with php8.2, and so spews a bunch of harmless but noisy
    # deprecation warnings here when used with php8.5.
    base: docker-registry.wikimedia.org/php8.5-cli:latest
    apt:
      packages:
        - composer
        - php8.5-apcu
        - php8.5-cli
        - php8.5-curl
        - php8.5-xml
        - unzip
    builder:
      requirements:
        - from: local
          source: ./frontend
          destination: .
      command:
        - sh
        - -c
        - >-
         composer install && composer test
  frontend:
    apt:
      packages:
        - apache2
        - libapache2-mod-php8.4
        - php8.4-apcu
        - php8.4-curl
        - php8.4-opcache
    copies:
      - from: frontend-prep
        source: /srv/app
        destination: /srv/app
      # outside of the document root, so it is not served
      - from: local
        source: ./.pipeline/frontend-apache2.conf
        destination: /etc/apache2/codesearch-frontend.conf
    entrypoint: [/usr/sbin/apache2, -f, /etc/apache2/codesearch-frontend.conf, -D, FOREGROUND]
