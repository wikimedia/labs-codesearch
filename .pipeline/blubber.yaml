version: v4
base: docker-registry.wikimedia.org/trixie:latest
variants:
  build:
    base: docker-registry.wikimedia.org/golang1.24:1.24-20261004
    apt:
      packages:
        - gcc
        - git
  prep:
    includes: [build]
    builder:
      command: [go, build, -buildvcs=false, ./cmds/houndd]
      requirements: [./hound]
  hound:
    apt:
      packages:
        - ca-certificates
        - git
    copies:
      - from: prep
        source: /srv/app/houndd
        destination: /srv/app/houndd
    entrypoint: ["./houndd", "-conf", "/data/config.json"]
